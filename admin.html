.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;min-width:0}

.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.tabs button.on{background:var(--g);color:#fff}
.row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}.sm{font-size:13px;color:var(--mut)}

.tag{font-size:12px;background:var(--bd);border-radius:999px;padding:1px 8px;margin-right:4px}.warn{color:var(--red)}.hid{opacity:.55}
img.th{max-width:120px;max-height:90px;border-radius:8px;border:1px solid var(--bd)}.win{background:rgba(217,130,0,.15);border:2px solid var(--o)}
