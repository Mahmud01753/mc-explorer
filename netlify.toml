# ⚠️ /admin ও /admin.html-এর হেডার (CSP সহ) এই ফাইলে আর _headers-এ হুবহু এক রাখুন — Cloudflare Pages শুধু _headers পড়ে, Netlify দুটোই পড়ে।
plugins = []
redirects = []

[functions]

  [functions."*"]

[build]
publish = "."

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/admin"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive"
  Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
  X-Frame-Options = "DENY"
  Referrer-Policy = "no-referrer"
  X-Content-Type-Options = "nosniff"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'"

[[headers]]
for = "/admin.html"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive"
  Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
  X-Frame-Options = "DENY"
  Referrer-Policy = "no-referrer"
  X-Content-Type-Options = "nosniff"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'"

[[headers]]
for = "/admin.js"

  [headers.values]
  X-Robots-Tag = "noindex"
  Cache-Control = "no-store"

[[headers]]
for = "/admin-gallery.js"

  [headers.values]
  X-Robots-Tag = "noindex"
  Cache-Control = "no-store"

[[headers]]
for = "/admin-prize.js"

  [headers.values]
  X-Robots-Tag = "noindex"
  Cache-Control = "no-store"